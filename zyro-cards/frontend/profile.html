<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<title>Zyro Cards — Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1626;
    --muted:#6b7488;
    --line:#e9ecf3;
    --paper:#ffffff;
    --canvas:#f3f5f9;
    --grad-a:#1c3fae;
    --grad-b:#2f6fed;
    --grad-c:#5aa2ff;
    --accent:#2f6fed;
    --radius-lg:28px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--canvas);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding:28px 14px 60px;
  }
  .phoneframe{
    width:100%;
    max-width:400px;
  }
  .card{
    background:var(--paper);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(20,30,60,0.25), 0 2px 8px rgba(20,30,60,0.06);
    opacity:0;
    transform:translateY(14px);
    animation:riseIn .55s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .card{ animation:none; opacity:1; transform:none; } }

  /* ---- hero banner ---- */
  .hero{
    position:relative;
    height:132px;
    background:
      linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 55%, var(--grad-c) 100%);
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.16) 48%, rgba(255,255,255,0.16) 56%, transparent 64%);
  }
  .hero .nfc-mark{
    position:absolute; top:14px; right:18px;
    color:rgba(255,255,255,0.85);
    font-size:11px; font-weight:600; letter-spacing:.06em;
    display:flex; align-items:center; gap:5px;
  }

  .avatar-wrap{
    display:flex; justify-content:center;
    margin-top:-58px;
    position:relative; z-index:2;
  }
  .avatar{
    width:104px; height:104px; border-radius:50%;
    object-fit:cover; background:var(--line);
    border:4px solid var(--paper);
    box-shadow:0 8px 20px rgba(20,30,60,0.18);
  }

  .identity{ text-align:center; padding:12px 28px 4px; }
  .identity .name{ font-family:'Manrope',sans-serif; font-weight:800; font-size:21px; margin:0; letter-spacing:-0.01em; }
  .identity .title{ color:var(--muted); font-size:13.5px; margin:4px 0 0; font-weight:500; }
  .identity .bio{ color:#495066; font-size:13px; line-height:1.55; margin:12px 0 0; }

  /* ---- quick action icon row ---- */
  .actions{
    display:flex; justify-content:center; gap:14px;
    padding:20px 20px 6px;
  }
  .action-btn{
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#eef2ff; color:var(--accent);
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 0 0 1px rgba(47,111,237,0.08) inset;
  }
  .action-btn:hover{ transform:translateY(-2px); box-shadow:0 8px 16px rgba(47,111,237,0.25); }
  .action-btn svg{ width:19px; height:19px; }

  /* ---- link list ---- */
  .section-label{
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); padding:18px 28px 6px;
  }
  .links{ padding:2px 16px 8px; display:flex; flex-direction:column; gap:8px; }
  .link-row{
    display:flex; align-items:center; gap:13px;
    background:var(--canvas);
    border:1px solid var(--line);
    border-radius:16px;
    padding:11px 14px;
    text-decoration:none; color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  .link-row:hover{ border-color:var(--accent); background:#eef2ff; }
  .link-icon{
    width:38px; height:38px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; color:#fff;
  }
  .link-icon svg{ width:18px; height:18px; }
  .link-text{ flex:1; min-width:0; }
  .link-text .label{ font-weight:700; font-size:14px; }
  .link-text .sub{ color:var(--muted); font-size:12px; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chev{ color:#b7bdcc; flex-shrink:0; }

  /* ---- save contact footer ---- */
  .footer{ padding:18px 24px 26px; }
  .save-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    background:var(--ink); color:#fff;
    border:none; border-radius:15px;
    padding:14px; font-weight:700; font-size:14.5px;
    text-decoration:none;
    box-shadow:0 10px 22px -8px rgba(15,22,38,0.45);
  }
  .powered{ text-align:center; font-size:11px; color:#9aa1b2; margin-top:14px; letter-spacing:.02em; }

  .state-msg{ padding:60px 24px; text-align:center; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<div class="phoneframe">
  <div class="card" id="profileBox">
    <div class="state-msg">Loading…</div>
  </div>
</div>

<script>
const API = window.location.origin;
const code = window.location.pathname.split("/u/")[1] || new URLSearchParams(window.location.search).get("code");

const ICONS = {
  phone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg>`,
  mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>`,
  message: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
  whatsapp: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3.1.8.8-3-.2-.3A8 8 0 1 1 12 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1s-.6.8-.7.9-.2.2-.4.1a6.5 6.5 0 0 1-1.9-1.2 7.1 7.1 0 0 1-1.3-1.6c-.1-.2 0-.3.1-.4l.3-.4.2-.3a.4.4 0 0 0 0-.4c-.1-.1-.5-1.3-.7-1.8s-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.7 2.7 0 0 0-.8 2 4.7 4.7 0 0 0 1 2.5 10.6 10.6 0 0 0 4.1 3.6c.6.2 1 .4 1.4.5a3.3 3.3 0 0 0 1.5.1 2.5 2.5 0 0 0 1.6-1.1 2 2 0 0 0 .1-1.1c-.1-.1-.2-.2-.4-.3z"/></svg>`,
  globe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
  facebook: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.2-1.5 1.5-1.5h1.7V3.7C16.4 3.6 15.4 3.5 14.3 3.5c-2.5 0-4.2 1.5-4.2 4.3v2.1H7.4V13h2.7v8h3.4z"/></svg>`,
  instagram: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>`,
  twitter: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 3H22l-7.2 8.2L23 21h-6.6l-5.2-6.6L5.2 21H2l7.7-8.8L1.5 3h6.8l4.7 6.1L18.9 3zM17.7 19h1.8L7.4 4.9H5.5L17.7 19z"/></svg>`,
  linkedin: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3V9zm7 0h3.8v1.7h.05c.53-1 1.83-2 3.77-2 4 0 4.75 2.6 4.75 6.1V21h-4v-5.6c0-1.3 0-3-1.85-3s-2.13 1.4-2.13 2.9V21h-4V9z"/></svg>`,
  youtube: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12s0-3.4-.4-5a2.8 2.8 0 0 0-2-2C17.9 4.5 12 4.5 12 4.5s-5.9 0-7.6.5a2.8 2.8 0 0 0-2 2C2 8.6 2 12 2 12s0 3.4.4 5a2.8 2.8 0 0 0 2 2c1.7.5 7.6.5 7.6.5s5.9 0 7.6-.5a2.8 2.8 0 0 0 2-2c.4-1.6.4-5 .4-5zM10 15.5v-7l6 3.5-6 3.5z"/></svg>`,
  telegram: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 2.7 11.8c-1 .4-1 1 0 1.4l4.9 1.5 1.9 5.8c.2.6.5.8.9.6l2.7-2 5 3.7c.8.5 1.3.2 1.5-.7l2.7-13.3c.3-1.2-.4-1.7-1.4-1.5zM9.4 14.6l9-5.6c.4-.3.8-.1.5.2l-7.3 6.6-.3 3.1z"/></svg>`,
  link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1"/></svg>`,
};
const ICON_COLORS = {
  facebook:"#1877f2", instagram:"linear-gradient(135deg,#feda75,#d62976 60%,#4f5bd5)", twitter:"#111827",
  linkedin:"#0a66c2", youtube:"#ff0000", telegram:"#229ed9", whatsapp:"#25d366", globe:"#5b6472", link:"#5b6472"
};
function matchIcon(label){
  const l = (label||"").toLowerCase();
  if(l.includes("facebook")) return "facebook";
  if(l.includes("instagram")) return "instagram";
  if(l.includes("twitter") || l.includes(" x") || l==="x") return "twitter";
  if(l.includes("linkedin")) return "linkedin";
  if(l.includes("youtube")) return "youtube";
  if(l.includes("telegram")) return "telegram";
  if(l.includes("whatsapp")) return "whatsapp";
  if(l.includes("website") || l.includes("site") || l.includes("portfolio")) return "globe";
  return "link";
}
function shortUrl(u){
  try{ const x = new URL(u); return x.hostname.replace("www.",""); } catch(e){ return u; }
}

async function load() {
  const box = document.getElementById("profileBox");
  if (!code) { box.innerHTML = `<div class="state-msg">কার্ডের কোড খুঁজে পাওয়া যায়নি।</div>`; return; }
  let r, p;
  try {
    r = await fetch(`${API}/api/public/${code}`);
    p = await r.json();
  } catch(e) {
    box.innerHTML = `<div class="state-msg">সার্ভারের সাথে সংযোগ করা যায়নি।</div>`; return;
  }
  if (!r.ok) { box.innerHTML = `<div class="state-msg">এই কার্ডটি এখনও অ্যাক্টিভেট করা হয়নি।</div>`; return; }

  const whatsappLink = (p.links||[]).find(l => (l.label||"").toLowerCase().includes("whatsapp"));

  const actions = [];
  if (p.phone) actions.push(`<a class="action-btn" href="tel:${p.phone}" title="Call">${ICONS.phone}</a>`);
  if (p.email_public) actions.push(`<a class="action-btn" href="mailto:${p.email_public}" title="Email">${ICONS.mail}</a>`);
  if (p.phone) actions.push(`<a class="action-btn" href="sms:${p.phone}" title="Message">${ICONS.message}</a>`);
  if (whatsappLink) actions.push(`<a class="action-btn" href="${whatsappLink.url}" target="_blank" title="WhatsApp">${ICONS.whatsapp}</a>`);

  const linkRows = (p.links||[]).map(l => {
    const key = matchIcon(l.label);
    const bg = ICON_COLORS[key] || "#5b6472";
    return `
      <a class="link-row" href="${l.url}" target="_blank" rel="noopener">
        <div class="link-icon" style="background:${bg}">${ICONS[key]}</div>
        <div class="link-text">
          <div class="label">${l.label || "Link"}</div>
          <div class="sub">${shortUrl(l.url)}</div>
        </div>
        <div class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
      </a>`;
  }).join("");

  box.innerHTML = `
    <div class="hero">
      <div class="nfc-mark">TAP · SCAN · CONNECT</div>
    </div>
    <div class="avatar-wrap">
      <img class="avatar" src="${p.photo_url || 'https://api.dicebear.com/7.x/initials/svg?seed=' + encodeURIComponent(p.full_name||'?')}" />
    </div>
    <div class="identity">
      <h1 class="name">${p.full_name || "Unnamed"}</h1>
      <p class="title">${[p.job_title, p.company].filter(Boolean).join(" · ")}</p>
      ${p.bio ? `<p class="bio">${p.bio}</p>` : ""}
    </div>
    ${actions.length ? `<div class="actions">${actions.join("")}</div>` : ""}
    ${linkRows ? `<div class="section-label">Connect</div><div class="links">${linkRows}</div>` : ""}
    <div class="footer">
      <a class="save-btn" href="${API}/api/vcard/${code}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Save Contact
      </a>
      <div class="powered">Digital identity by Zyro Cards</div>
    </div>
  `;
}
load();
</script>
</body>
</html>
